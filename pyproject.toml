[project]
name = "metamove"
version = "0.4.0"
description = "Transform YAML: move meta under config.meta"
authors = [{name = "Oliver Laslett", email = "oliver@lightdash.com"}]
readme = "README.md"
license = {text = "MIT"}
keywords = ["yaml", "transform", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.9,<3.14"
dependencies = [
    "ruamel-yaml==0.18.6",
    "click>=8.0.0",
    "setuptools>=78.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
metamove = "metamove.cli:cli"

[project.urls]
Repository = "https://github.com/lightdash/metamove"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build" 